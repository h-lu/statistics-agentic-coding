    .layout{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:14px;align-items:start}.rail,.stage,.console{background:rgba(255,255,255,.92);border:1px solid rgba(216,222,233,.96);border-radius:var(--radius);box-shadow:var(--shadow)}
    .rail{padding:14px;position:sticky;top:14px}.rail h2,.console h2{font-size:13px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:4px 6px 12px}.path{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:1px solid transparent;background:transparent;border-radius:16px;padding:12px;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;color:var(--ink)}.nav button:hover{background:#f8fafc;border-color:#e5e7eb}.nav button.active{background:var(--blue-soft);border-color:#bfdbfe}.num{height:30px;border-radius:11px;background:#e2e8f0;color:#334155;display:grid;place-items:center;font:700 12px var(--mono)}.nav button.active .num{background:var(--blue);color:white}.nav-title{font-weight:800}.nav-desc{font-size:12px;color:var(--muted);margin-top:2px}.legend{margin-top:14px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}.legend-row{display:flex;align-items:center;gap:8px;margin:5px 0}.dot{width:10px;height:10px;border-radius:99px}.train{background:var(--blue)}.test{background:var(--orange)}.baseline{background:#94a3b8}.risk{background:var(--red)}
    .stage{padding:16px;min-width:0}.module-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.module-head h1{font-size:24px;margin:0 0 4px}.module-head p{margin:0;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:var(--green-soft);color:#166534;font-size:12px;font-weight:700;white-space:nowrap}.canvas-wrap{position:relative;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#ffffff,#f8fafc);padding:12px}.canvas-wrap canvas{width:100%;height:520px;display:block;border-radius:16px;background:#fff}.insight{margin-top:12px;border-radius:18px;border:1px solid #bfdbfe;background:#eff6ff;padding:13px 14px}.insight b{color:#1d4ed8}.notebook{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.note-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px}.note-card h3{margin:0 0 6px;font-size:14px}.note-card p{margin:0;color:var(--muted);font-size:13px}
    .console{padding:14px;position:sticky;top:14px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.metric .value{font:800 22px var(--mono);margin-top:2px}.metric.good .value{color:var(--green)}.metric.warn .value{color:var(--orange)}.metric.bad .value{color:var(--red)}.controls{display:flex;flex-direction:column;gap:12px}.control{padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}.control small{display:block;color:var(--muted);margin-top:5px}.control input[type=range]{width:100%;accent-color:var(--blue);margin-top:10px}.control select{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:12px;padding:9px;background:white}.check{display:flex;gap:8px;align-items:center;margin-top:9px;color:var(--muted);font-size:13px}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:14px;background:var(--blue);color:white;padding:10px 12px;font-weight:800}.btn.secondary{background:#e2e8f0;color:#334155}.btn.warn{background:var(--orange);color:#3b2500}.btn.danger{background:var(--red)}.explain{margin-top:12px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);padding:12px;color:#334155;font-size:13px}.hidden{display:none!important}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.pill{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}.pill.good{background:var(--green-soft);color:#166534}.pill.warn{background:var(--orange-soft);color:#9a3412}.pill.bad{background:var(--red-soft);color:#991b1b}
    @media (max-width:1100px){.layout{grid-template-columns:1fr}.rail,.console{position:static}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.canvas-wrap canvas{height:430px}.notebook{grid-template-columns:1fr}}
    @media (max-width:640px){.app{padding:10px}.topbar{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.module-head{flex-direction:column}.canvas-wrap canvas{height:360px}}
    @media (prefers-reduced-motion:no-preference){.nav button,.btn,.switch button{transition:.18s ease}.nav button:hover,.btn:hover{transform:translateY(-1px)}}
  </style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark">T11</div><div><div class="kicker">Statistics · Week 11</div><div class="title">Tree Model Studio：树模型研究工作台</div><div class="subtitle">用同一个实验室串起：决策边界、剪枝、不稳定、随机森林、Baseline、重要性陷阱。</div></div></div>
    <div class="mode"><span class="subtitle">模式</span><div class="switch" role="tablist" aria-label="演示模式"><button id="teachMode" class="active">课堂演示</button><button id="studyMode">学生实验</button></div></div>
  </header>
  <main class="layout">
    <aside class="rail" aria-label="模块导航">
      <h2>学习路径</h2>
      <div class="path">不要追求“最复杂”。每一步都问：它比简单基线稳定地好多少？代价是什么？</div>
      <nav class="nav" id="moduleNav"></nav>
      <div class="legend"><b>图例</b><div class="legend-row"><span class="dot train"></span>训练/模型区域</div><div class="legend-row"><span class="dot test"></span>测试/泛化信号</div><div class="legend-row"><span class="dot baseline"></span>Baseline 参考</div><div class="legend-row"><span class="dot risk"></span>风险/泄漏/过拟合</div></div>
    </aside>
    <section class="stage">
      <div class="module-head"><div><h1 id="moduleTitle"></h1><p id="moduleSubtitle"></p></div><div class="badge" id="moduleBadge"></div></div>
      <div class="canvas-wrap"><canvas id="studio" width="980" height="560" aria-label="树模型交互画布"></canvas></div>
      <div class="insight" id="insight"></div>
      <div class="notebook"><div class="note-card"><h3>课堂追问</h3><p id="question"></p></div><div class="note-card"><h3 id="taskTitle">学生实验任务</h3><p id="task"></p></div></div>
    </section>
    <aside class="console">
      <h2>参数控制台</h2>
      <div class="metrics" id="metrics"></div>
      <div class="controls" id="controls"></div>
      <div class="explain" id="explain"></div>
    </aside>
  </main>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('studio');
  const ctx = canvas.getContext('2d');
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      return this;
    };
  }
  const nav = document.getElementById('moduleNav');
  const metricsEl = document.getElementById('metrics');
  const controlsEl = document.getElementById('controls');
  const $ = id => document.getElementById(id);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const fmt=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—';
  let studyMode = false;
  let seed = 42;
  function rng(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function normal(){ const u=Math.max(rng(),1e-6), v=Math.max(rng(),1e-6); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function sigmoid(x){ return 1/(1+Math.exp(-x)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); }
  function roundRect(x,y,w,h,r,fill,stroke){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.stroke();} }
  function text(t,x,y,opt={}){ ctx.save(); ctx.fillStyle=opt.color||'#0f172a'; ctx.font=`${opt.weight||600} ${opt.size||14}px ${opt.mono?'Consolas,monospace':'-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif'}`; ctx.textAlign=opt.align||'left'; ctx.textBaseline=opt.base||'alphabetic'; ctx.fillText(t,x,y); ctx.restore(); }
  function line(x1,y1,x2,y2,color='#94a3b8',w=1,dash=[]){ ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=w; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
  function axes(x,y,w,h,labels=['x1','x2']){ roundRect(x,y,w,h,16,'#fff','#d8dee9'); for(let i=1;i<5;i++){ line(x+i*w/5,y,x+i*w/5,y+h,'#eef2f7'); line(x,y+i*h/5,x+w,y+i*h/5,'#eef2f7'); } text(labels[0],x+w-24,y+h-12,{size:12,color:'#64748b'}); text(labels[1],x+12,y+18,{size:12,color:'#64748b'}); }
  function mapPoint(p,x,y,w,h){ return [x + p.x*w, y + (1-p.y)*h]; }
  function dot(px,py,color,r=4,stroke='#fff'){ ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=stroke; ctx.stroke(); }
  function makeData(n=110, noise=.18, pattern='islands'){ const pts=[]; for(let i=0;i<n;i++){ const x=rng(), y=rng(); let score; if(pattern==='linear') score=x+y-1; else if(pattern==='moons') score=Math.sin(x*7.2)+Math.cos(y*6.4)+(x-y)*.8; else score=((x>.55&&y>.45)||(x<.35&&y<.30)?1:-1) + .35*Math.sin(11*x*y); score += normal()*noise; const cls=score>0?1:0; pts.push({x,y,cls,train:i<n*.65}); } return pts; }
  function treeProb(x,y,depth,pattern='islands',leaf=5,shift=0){ let p=.45; if(pattern==='linear') p = sigmoid((x+y-1+shift*.18)*7); else if(pattern==='moons') p=sigmoid((Math.sin((x+shift*.04)*7.2)+Math.cos((y-shift*.03)*6.4)+(x-y)*.8)*1.6); else p = (((x+shift*.06)>.55&&y>.45)||(x<.35&&(y-shift*.05)<.30))?.78:.22; const effectiveDepth=clamp(depth - Math.max(0,leaf-4)/5,1,7); const cells=Math.pow(2,effectiveDepth); const jitter=((Math.floor((x+shift*.03)*cells)*17+Math.floor((y-shift*.02)*cells)*31)%11-5)/100; return clamp(p+jitter*effectiveDepth/3,.03,.97); }
  function drawBoundary(x,y,w,h,depth,pattern,forest=false,opt={}){ const step=10; const leaf=opt.leaf ?? 5, trees=opt.trees ?? 30, features=opt.features ?? 60, ratio=opt.ratio ?? 70, shift=opt.shift ?? 0; for(let i=0;i<w;i+=step){ for(let j=0;j<h;j+=step){ const xx=(i+step/2)/w, yy=1-(j+step/2)/h; let p=treeProb(xx,yy,depth,pattern,leaf,shift); if(forest){ const voters=Math.max(3,Math.min(21,Math.round(trees/6))); let sum=0; for(let k=0;k<voters;k++){ const localShift=(k-voters/2)*.012 + (features-60)/1800 + (ratio-70)/2200; sum += treeProb(xx+localShift,yy-localShift,Math.max(1,depth-(k%3)),pattern,leaf,localShift); } p=sum/voters; } const alpha=forest?.10+.09*Math.min(1,trees/80):.11+.01*Math.min(depth,8); ctx.fillStyle=p>.5?`rgba(37,99,235,${alpha})`:`rgba(245,158,11,${alpha})`; ctx.fillRect(x+i,y+j,step,step); } } }
  function drawDataset(pts,x,y,w,h){ pts.forEach(p=>{ const [px,py]=mapPoint(p,x,y,w,h); dot(px,py,p.cls?'#2563eb':'#f59e0b',p.train?4:5,p.train?'#fff':'#0f172a'); }); }
  const modules = {
    boundary:{n:'01',title:'决策边界实验',desc:'看树如何用阶梯边界逼近非线性关系。',badge:'从直线到阶梯',state:{depth:3,leaf:5,noise:18,pattern:'islands'}, question:'当 max_depth 继续增加，边界更贴合训练点，但它真的学到了规律吗？', task:'把数据形状切到“线性”，比较逻辑回归一条斜线与树的阶梯边界谁更经济。', controls:[['range','depth','max_depth',1,8],['range','leaf','min_samples_leaf',1,20],['range','noise','噪声',0,35],['select','pattern','数据形状',['islands','linear','moons'],['岛屿形','线性可分','波浪形']]], draw(s){ seed=7; const noise=s.noise/100; const pts=makeData(130,noise,s.pattern); const x=38,y=32,w=650,h=430; axes(x,y,w,h); drawBoundary(x,y,w,h,s.depth,s.pattern,false,{leaf:s.leaf,shift:s.noise/100}); const effectiveDepth=clamp(s.depth - Math.max(0,s.leaf-4)/5,1,7); const cells=Math.pow(2,Math.round(effectiveDepth)); for(let i=1;i<cells;i++){ if(i%2===0 || cells<=8) line(x+i*w/cells,y,x+i*w/cells,y+h,'rgba(37,99,235,.18)',1); if(i%2===1 || cells<=8) line(x,y+i*h/cells,x+w,y+i*h/cells,'rgba(245,158,11,.18)',1); } drawDataset(pts,x,y,w,h); text('蓝/橙背景表示树模型预测区域；min_samples_leaf 越大，切分越粗。',x,y+h+34,{color:'#64748b',size:13}); const train=.72+s.depth*.035-noise*.35-s.leaf*.004; const test=.70+s.depth*.025-Math.max(0,s.depth-4)*.05-noise*.25+Math.min(s.leaf,12)*.006; return {metrics:[['Train AUC',clamp(train,.55,.99),'warn'],['Test AUC',clamp(test,.52,.93),s.depth>5&&s.leaf<8?'bad':'good'],['估计叶子数',Math.max(2,Math.round(Math.pow(2,s.depth)*4/(s.leaf+3))),''],['泛化差距',Math.max(0,train-test),'bad']], insight:`<b>当前判断：</b>深度 ${s.depth}、叶节点最小样本 ${s.leaf} 会共同改变边界粗细；边界越碎，越可能是在记忆噪声。`, explain:'树模型的优势是能自动形成 if-else 区域；风险是每多一层、每个叶子越小，解释和泛化都要付出成本。'}; }}
  };
  modules.pruning={n:'02',title:'分裂与剪枝实验',desc:'观察 impurity 下降、叶子数和复杂度惩罚之间的权衡。',badge:'贪心生长，克制修剪',state:{criterion:'gini',depth:4,alpha:3,minsplit:12},question:'如果一个分裂只让 impurity 降低一点点，但多出很多叶子，值得吗？',task:'把 ccp_alpha 从 0 拉到 10，记录哪一刻测试 AUC 最高。',controls:[['select','criterion','分裂标准',['gini','entropy'],['Gini','Entropy']],['range','depth','max_depth',1,8],['range','alpha','ccp_alpha ×100',0,12],['range','minsplit','min_samples_split',2,30]],draw(s){ const x=40,y=36; const leaves=Math.max(2,Math.round(Math.pow(2,s.depth)*(1-s.alpha/18)*(18/(s.minsplit+10)))); const impurity=clamp(.52-s.depth*.045+s.alpha*.012+s.minsplit*.003,.08,.50); const train=clamp(.68+s.depth*.045-s.alpha*.01-s.minsplit*.002,.55,.99); const test=clamp(.66+s.depth*.036-Math.max(0,s.depth-4)*.045-Math.abs(s.alpha-4)*.01+Math.min(s.minsplit,18)*.003,.52,.91); roundRect(36,28,670,420,20,'#fff','#d8dee9'); const nodes=[[360,72,'根节点\n样本 240\nimpurity '+fmt(.48,2)],[210,180,'x1 < 0.42\nΔ='+fmt(.18+s.depth*.01,2)],[510,180,'x2 < 0.61\nΔ='+fmt(.13+s.depth*.008,2)],[135,310,'叶 '+Math.ceil(leaves*.28)],[285,310,'叶 '+Math.ceil(leaves*.22)],[445,310,'叶 '+Math.ceil(leaves*.25)],[595,310,'叶 '+Math.ceil(leaves*.25)]]; [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]].forEach(([a,b])=>line(nodes[a][0],nodes[a][1]+34,nodes[b][0],nodes[b][1]-34,'#94a3b8',2)); nodes.forEach((nd,i)=>{ roundRect(nd[0]-72,nd[1]-34,144,68,16,i<3?'#eff6ff':'#f8fafc','#bfdbfe'); nd[2].split('\n').forEach((t,k)=>text(t,nd[0],nd[1]-12+k*18,{align:'center',size:k?12:13,color:k?'#475569':'#0f172a'})); }); roundRect(52,382,Math.max(80,260-s.minsplit*5-s.alpha*8),18,9,'#2563eb'); text('剪枝/最小分裂越强，保留下来的复杂度越少。',52,410,{color:'#64748b',size:13}); for(let i=0;i<10;i++){ const px=760+i*20, py=360-(Math.sin(i/2)+1)*45-(i<5?i*7:(10-i)*7); dot(px,py,i===Math.round(s.alpha)?'#2563eb':'#cbd5e1',4,'#fff'); } text('alpha 扫描',744,402,{size:12,color:'#64748b'}); return {metrics:[['Train AUC',train,'warn'],['Test AUC',test,'good'],['叶子数',leaves,''],['节点不纯度',impurity,'']],insight:`<b>当前判断：</b>${s.criterion} 标准会贪心选择当前最划算的切分；剪枝不是让模型变弱，而是删除证据不足的复杂度。`,explain:'预剪枝控制树怎么长，后剪枝控制长完以后留下多少。二者共同目标都是降低“记住训练集”的冲动。'};}};
  modules.instability={n:'03',title:'单棵树不稳定实验',desc:'轻微扰动数据，观察根节点、边界和预测如何跳变。',badge:'高方差模型',state:{perturb:12,remove:1,seedShift:0},question:'如果只删除一个样本，根节点规则就变了，你还会把这棵树当作稳定解释吗？',task:'点击“重新抽样”三次，记录根节点规则变化次数。',controls:[['range','perturb','扰动强度',0,35],['range','remove','删除样本数',0,8],['button','resample','重新抽样']],draw(s){ seed=22+s.seedShift; const p1=makeData(100,.15,'islands'); seed=22+s.seedShift+s.perturb*13+s.remove*29; const p2=makeData(100,.15+s.perturb/300,'islands'); const x1=32,y=36,w=410,h=370,x2=520; axes(x1,y,w,h,['原始树','']); axes(x2,y,w,h,['扰动后','']); drawBoundary(x1,y,w,h,4,'islands'); drawBoundary(x2,y,w,h,s.perturb>18?5:3,'islands'); drawDataset(p1,x1,y,w,h); drawDataset(p2.slice(s.remove),x2,y,w,h); const changed=s.perturb+s.remove*3>18; const root1='purchase_count < 3.5'; const root2=changed?'avg_spend < 92.0':'purchase_count < 3.7'; roundRect(160,430,300,58,16,'#eff6ff','#bfdbfe'); text('原始根节点：'+root1,310,464,{align:'center',size:13}); roundRect(620,430,300,58,16,changed?'#fee2e2':'#eff6ff',changed?'#fecaca':'#bfdbfe'); text('新根节点：'+root2,770,464,{align:'center',size:13,color:changed?'#991b1b':'#0f172a'}); const disagree=clamp((s.perturb*.9+s.remove*4)/100,.02,.42); return {metrics:[['根节点变化',changed?'是':'否',changed?'bad':'good'],['预测不一致',disagree,'bad'],['扰动强度',s.perturb,''],['删除样本',s.remove,'']],insight:`<b>当前判断：</b>单棵树对样本扰动敏感。它的规则很直观，但不一定稳定。`,explain:'如果解释会随着样本微调而大幅改变，就不能把单棵树的某条规则当成铁律。'};}};
  modules.forest={n:'04',title:'随机森林投票实验',desc:'从一棵抖动的树，到多棵树投票后的稳定边界。',badge:'Bagging + 特征随机性',state:{trees:30,depth:4,features:60,ratio:70},question:'树越多为什么不一定继续提升 AUC，但会让结果更稳定？',task:'把树数量从 1 调到 100，观察 Test AUC 和稳定性哪一个先趋于平稳。',controls:[['range','trees','n_estimators',1,120],['range','depth','max_depth',1,8],['range','features','max_features %',20,100],['range','ratio','bootstrap sample %',40,100]],draw(s){ seed=9; const pts=makeData(130,.17,'moons'); const x=38,y=34,w=650,h=430; axes(x,y,w,h); drawBoundary(x,y,w,h,s.depth,'moons',true,{trees:s.trees,features:s.features,ratio:s.ratio,leaf:4,shift:(s.features-60)/200}); drawDataset(pts,x,y,w,h); const miniCount=Math.min(12,Math.max(1,Math.round(s.trees/10))); for(let i=0;i<miniCount;i++){ const mx=x+12+i*28, my=y+12+(i%2)*22; roundRect(mx,my,20,14,5, i%3===0?'rgba(37,99,235,.55)':i%3===1?'rgba(245,158,11,.55)':'rgba(22,163,74,.55)'); } text(`可见投票树：${miniCount} / ${s.trees}`,x+12,y+66,{size:12,color:'#475569'}); const cx=770,cy=80; text('AUC 随树数量变化',cx,cy,{size:14}); line(cx,cy+150,cx+170,cy+150,'#cbd5e1'); line(cx,cy+20,cx,cy+150,'#cbd5e1'); ctx.beginPath(); for(let i=0;i<=12;i++){ const t=i/12, trees=1+t*120, auc=.66+.22*(1-Math.exp(-trees/22))-Math.max(0,s.depth-6)*.01; const px=cx+t*170, py=cy+150-(auc-.6)*360; if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.strokeStyle='#2563eb'; ctx.lineWidth=3; ctx.stroke(); const test=clamp(.66+.22*(1-Math.exp(-s.trees/22))-Math.max(0,s.depth-6)*.018,.55,.91); const stability=clamp(1-Math.exp(-s.trees/28),.05,.99); return {metrics:[['Test AUC',test,'good'],['稳定性',stability,'good'],['树数量',s.trees,''],['特征随机性',s.features+'%','']],insight:`<b>当前判断：</b>森林不是让每棵树更聪明，而是让许多不稳定的树互相抵消。`,explain:'Bagging 的核心是“有差异的模型投票”。如果所有树都一样，投票不会带来稳定性。'};}};
  modules.baseline={n:'05',title:'Baseline 对战实验',desc:'复杂模型必须证明自己比简单模型稳定地更好。',badge:'模型选择不是排行榜',state:{imbalance:62,noise:18,leakage:false,sample:240},question:'随机森林比逻辑回归只高 0.01 AUC，而且解释更难，这个提升值得吗？',task:'打开泄漏变量，看 AUC 暴涨；再解释为什么这不是模型真正变强。',controls:[['range','imbalance','多数类比例 %',50,90],['range','noise','噪声',0,35],['range','sample','样本量',80,600],['checkbox','leakage','加入泄漏变量']],draw(s){ const leak=s.leakage; const sampleBonus=Math.min(.035,Math.log(s.sample/80)*.012); const imbalancePenalty=(s.imbalance-50)/700; const rows=[['多数类基线',.50,.50,`多数类 ${s.imbalance}%`],['单特征规则',.60-s.noise/500-imbalancePenalty,.58-s.noise/450-imbalancePenalty,'可解释'],['逻辑回归',.72-s.noise/700-imbalancePenalty+sampleBonus,.70-s.noise/650-imbalancePenalty+sampleBonus,'强基线'],['决策树',.82-s.noise/650,.72-s.noise/420-imbalancePenalty+sampleBonus*.5,'易过拟合'],['随机森林',leak?.98:.84-s.noise/800+sampleBonus*.4,leak?.97:.75-s.noise/520-imbalancePenalty+sampleBonus,leak?'疑似泄漏':'候选']]; roundRect(35,34,610,370,18,'#fff','#d8dee9'); text('模型对比表',58,66,{size:16}); roundRect(410,50,170,16,8,'#e2e8f0'); roundRect(410,50,170*(s.imbalance-50)/40,16,8,'#f59e0b'); text(`类别不平衡 ${s.imbalance}%`,410,43,{size:12,color:'#64748b'}); let yy=98; ['模型','Train AUC','Test AUC','判断'].forEach((h,i)=>text(h,60+i*145,yy,{size:12,color:'#64748b'})); yy+=22; rows.forEach((r,idx)=>{ const risk=(r[2]-rows[2][2])<.015&&idx>2; const fill=leak&&idx===4?'#fee2e2':risk?'#fff7ed':'#fff'; roundRect(52,yy-18,545,34,10,fill,'#e5e7eb'); r.forEach((c,i)=>text(typeof c==='number'?fmt(c,2):c,60+i*145,yy+4,{size:13,color:i===3&&leak&&idx===4?'#991b1b':'#0f172a',mono:i>0&&i<3})); yy+=42; }); const x=700,y=70; text('ROC 直觉图',x,y,{size:16}); line(x,y+260,x+230,y+260,'#cbd5e1'); line(x,y+30,x,y+260,'#cbd5e1'); rows.slice(0,5).forEach((r,i)=>{ ctx.beginPath(); for(let k=0;k<=20;k++){ const t=k/20; const lift=(r[2]-.5)*1.7; const px=x+t*230, py=y+260-(Math.pow(t,.9-lift*.45))*220; if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.strokeStyle=['#94a3b8','#64748b','#2563eb','#f59e0b','#16a34a'][i]; ctx.lineWidth=i===4?3:2; ctx.stroke(); }); const forest=rows[4][2], logi=rows[2][2], diff=forest-logi; return {metrics:[['RF-Test AUC',forest,leak?'bad':'good'],['相对逻辑回归',diff,diff>.03?'good':'warn'],['样本量',s.sample,''],['多数类比例',s.imbalance+'%','warn']],insight:`<b>当前判断：</b>${leak?'AUC 暴涨首先要怀疑数据泄漏，不要急着庆祝。':'如果复杂模型提升很小，就要权衡解释成本、维护成本和不确定性。'}`,explain:'Baseline 不是低级模型，而是判断复杂模型是否值得的参照物。没有 baseline 的模型报告是不完整的。'};}};
  modules.importance={n:'06',title:'特征重要性陷阱实验',desc:'同一个模型会给出不同“重要性”，而泄漏变量会让解释变危险。',badge:'解释需要审查',state:{corr:true,highcard:false,leak:false,noise:true},question:'模型说某个特征重要，我们能直接把它写成业务结论吗？',task:'依次打开高基数变量和泄漏变量，比较 Gini 与 Permutation importance 的变化。',controls:[['checkbox','corr','加入相关特征'],['checkbox','highcard','加入高基数分类变量'],['checkbox','leak','加入泄漏变量'],['checkbox','noise','加入纯噪声变量']],draw(s){ let feats=[['recent_days',.30,.28,.07],['purchase_count',.23,.20,.05],['avg_spend',.18,.16,.04]]; if(s.corr) feats.push(['spend_copy',.16,.03,.00]); if(s.highcard) feats.push(['user_code',.22,.01,.00]); if(s.noise) feats.push(['random_noise',.08,.00,.00]); if(s.leak) feats.unshift(['future_churn_flag',.55,.50,.29]); const x=50,y=54,w=760,row=44; text('Gini importance vs Permutation importance vs 删除后 AUC 下降',x,y-18,{size:15}); feats.forEach((f,i)=>{ const yy=y+i*row; text(f[0],x,yy+16,{size:13,mono:true}); [['#2563eb',f[1],170],['#f59e0b',f[2],390],['#16a34a',f[3],610]].forEach(([c,v,off])=>{ roundRect(x+off,yy,150,18,9,'#eef2f7'); roundRect(x+off,yy,150*v/.6,18,9,c); text(fmt(v,2),x+off+156,yy+15,{size:12,mono:true,color:'#64748b'}); }); }); ['Gini','Permutation','Drop AUC'].forEach((h,i)=>text(h,x+[170,390,610][i],y+feats.length*row+18,{size:12,color:'#64748b'})); const warning=s.leak?'检测到泄漏变量：重要性高不代表可用于真实预测。':s.highcard?'高基数变量可能抬高 Gini importance，需要 permutation 或消融验证。':'重要性只是审查起点，不是最终解释。'; return {metrics:[['特征数',feats.length,''],['最高 Gini',Math.max(...feats.map(f=>f[1])),'warn'],['泄漏风险',s.leak?'高':'低',s.leak?'bad':'good'],['解释可信度',s.leak?'低':s.highcard?'中':'较高',s.leak?'bad':s.highcard?'warn':'good']],insight:`<b>当前判断：</b>${warning}`,explain:'Gini importance 偏爱能产生更多切分的变量；Permutation 和删除特征后的性能变化更接近“这个特征对预测是否真的有用”。'};}}
  function renderNav(){ nav.innerHTML=''; Object.entries(modules).forEach(([id,m])=>{ const b=document.createElement('button'); b.dataset.id=id; b.innerHTML=`<span class="num">${m.n}</span><span><span class="nav-title">${m.title}</span><span class="nav-desc">${m.desc}</span></span>`; b.addEventListener('click',()=>setModule(id)); nav.appendChild(b); }); }
  let current = location.hash.replace('#','') || 'boundary'; if(!modules[current]) current='boundary';
  function controlHtml(m){ return m.controls.map(c=>{ const [type,key,label,a,b,c2]=c; const val=m.state[key]; if(type==='range') return `<div class="control"><label>${label}<span id="v-${key}">${val}</span></label><input data-key="${key}" type="range" min="${a}" max="${b}" value="${val}"></div>`; if(type==='select') return `<div class="control"><label>${label}</label><select data-key="${key}">${a.map((v,i)=>`<option value="${v}" ${v===val?'selected':''}>${b[i]}</option>`).join('')}</select></div>`; if(type==='checkbox') return `<div class="control"><label>${label}<input data-key="${key}" type="checkbox" ${val?'checked':''}></label><small>开关后立即重新计算。</small></div>`; if(type==='button') return `<div class="btn-row"><button class="btn secondary" data-action="${key}">${label}</button></div>`; }).join(''); }
  function renderMetrics(items){ metricsEl.innerHTML=items.map(([lab,val,kind])=>`<div class="metric ${kind||''}"><div class="label">${lab}</div><div class="value">${typeof val==='number'?fmt(val,typeof val==='number'&&val<1?2:0):val}</div></div>`).join(''); }
  function draw(){ clear(); const m=modules[current]; $('moduleTitle').textContent=m.title; $('moduleSubtitle').textContent=m.desc; $('moduleBadge').textContent=m.badge; $('question').textContent=m.question; $('taskTitle').textContent=studyMode?'学生实验任务':'课堂追问之后'; $('task').textContent=studyMode?m.task:'先让学生猜，再操作参数验证；不要直接公布答案。'; const out=m.draw(m.state); renderMetrics(out.metrics); $('insight').innerHTML=out.insight; $('explain').textContent=out.explain; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===current)); }
  function setModule(id){ current=id; history.replaceState(null,'','#'+id); const m=modules[current]; controlsEl.innerHTML=controlHtml(m); controlsEl.querySelectorAll('input,select').forEach(el=>{ const update=()=>{ const key=el.dataset.key; if(el.type==='checkbox') m.state[key]=el.checked; else if(el.type==='range') { m.state[key]=Number(el.value); const label=$('v-'+key); if(label) label.textContent=el.value; } else m.state[key]=el.value; draw(); }; el.addEventListener('input',update); el.addEventListener('change',update); }); controlsEl.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{ if(btn.dataset.action==='resample') m.state.seedShift=(m.state.seedShift||0)+1; draw(); })); draw(); }
  $('teachMode').addEventListener('click',()=>{ studyMode=false; $('teachMode').classList.add('active'); $('studyMode').classList.remove('active'); draw(); });
  $('studyMode').addEventListener('click',()=>{ studyMode=true; $('studyMode').classList.add('active'); $('teachMode').classList.remove('active'); draw(); });
  window.addEventListener('hashchange',()=>{ const id=location.hash.replace('#',''); if(modules[id]) setModule(id); });
  renderNav(); setModule(current);
})();
</script>
