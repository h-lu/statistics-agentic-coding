# Week 12 术语表
#
# 本周新概念（5 个，预算上限 5 个）
# 每个术语必须同步到 shared/glossary.yml

- term_zh: 特征重要性
  term_en: Feature Importance
  definition_zh: 全局可解释性指标，衡量每个特征对模型预测的贡献程度。随机森林的特征重要性基于每个特征在所有树的分裂中带来的不纯度减少量。但有两个陷阱：（1）只有强度没有方向；（2）相关特征会互相"分票"
  first_seen: week_12

- term_zh: SHAP 值
  term_en: SHAP values
  definition_zh: 基于 Shapley 值的局部可解释性方法，回答"每个特征对这个预测的贡献是多少"。它具有可加性，但加总对应的是 explainer 选定的输出空间（常见是模型输出或 log-odds），不是天然的概率百分点。同一特征对不同样本的贡献可能不同
  first_seen: week_12

- term_zh: 数据偏见与算法偏见
  term_en: Data Bias vs Algorithmic Bias
  definition_zh: 数据偏见来自训练数据本身（如历史上女性获得贷款少），算法偏见来自算法放大了数据中的偏见（如对少数群体使用更保守的阈值）。模型会忠实地学习数据中的模式，不管这些模式是"规律"还是"偏见"
  first_seen: week_12

- term_zh: 公平性指标
  term_en: Fairness Metrics
  definition_zh: 评估模型对不同群体是否公平的指标。常见定义包括：（1）统计均等——各群体预测正率相同；（2）机会均等（Equal Opportunity）——各群体真阳性率相同；（3）Equalized Odds——各群体真阳性率、假阳性率都相同；（4）校准——各群体预测概率与真实概率匹配。这些定义彼此可能冲突，需根据业务场景选择
  first_seen: week_12

- term_zh: 对非技术读者的解释
  term_en: Non-technical Communication
  definition_zh: 把统计术语翻译成业务语言的沟通能力。例如：AUC = 0.89 应翻译为"模型排序区分能力较强"，而不是"89% 都判断对了"；p < 0.05 应表述为"若原假设为真，观察到当前或更极端结果的概率低于 5%"；SHAP 值可翻译为"风险驱动因素"，但要先说明它对应的输出空间
  first_seen: week_12
