<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Residual Diagnostics Lab：残差图诊断诊所</title><style>

solid var(--line);border-radius:16px}.controls{display:grid;gap:13px}.control{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.control label{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:#334155;margin-bottom:8px}.control input[type=range]{width:100%;accent-color:var(--blue)}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{border:none;background:var(--blue);color:white;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.22)}.btn.secondary{background:#e0f2fe;color:#075985}.btn.warn{background:var(--orange)}.btn.ghost{background:#f1f5f9;color:#334155}.btn:hover{filter:brightness(.96);transform:translateY(-1px)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.metric .label{font-size:12px;color:var(--muted);font-weight:800}.metric .value{font-size:25px;font-weight:900;margin-top:3px;color:#0f172a}.explain{margin-top:14px;border-radius:16px;padding:15px 16px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;line-height:1.55}.question{margin-top:14px;border-radius:16px;padding:15px 16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:#e0f2fe;color:#075985;font-weight:900;font-size:12px}.risk-good{background:#dcfce7!important;border-color:#bbf7d0!important;color:#166534!important}.risk-mid{background:#fef9c3!important;border-color:#fde68a!important;color:#854d0e!important}.risk-bad{background:#fee2e2!important;border-color:#fecaca!important;color:#991b1b!important}.choice{display:block;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.choice input{margin-right:8px}canvas{display:block;width:100%;height:100%}.footer{margin-top:22px;color:#64748b;font-size:13px;text-align:center}@media(max-width:980px){.grid,.goals{grid-template-columns:1fr}.plot{height:430px}.top h1{font-size:28px}}

<body><header class="top"><div class="kicker">Week 09 · 回归分析与诊断</div><h1>Residual Diagnostics Lab：残差图诊断诊所</h1><p>切换数据场景，训练学生从残差图、QQ 图和 Cook 距离识别模型问题。</p><nav class="nav"><a class="" href="01_ols_line_lab.html">OLS</a><a class="active" href="02_residual_diagnostics_lab.html">诊断</a><a class="" href="03_r2_prediction_trap.html">R²陷阱</a><a class="" href="04_multicollinearity_vif_lab.html">VIF</a><a class="" href="05_interaction_terms_explorer.html">交互项</a></nav></header><main class="wrap"><section class="goals"><div class="goal">用图形识别 LINE 假设问题</div><div class="goal">理解残差图比单看 R² 更重要</div><div class="goal">练习诊断后给出下一步处理</div></section><section class="grid"><div class="card"><h2>残差图诊断诊所</h2><div class="smallplots"><canvas id="p1" class="smallplot"></canvas><canvas id="p2" class="smallplot"></canvas><canvas id="p3" class="smallplot"></canvas><canvas id="p4" class="smallplot"></canvas></div></div><aside class="card"><h3>选择场景</h3><div class="btns"><button class="btn scenario" data-s="linear">线性等方差</button><button class="btn secondary scenario" data-s="curve">非线性</button><button class="btn secondary scenario" data-s="fan">异方差</button><button class="btn secondary scenario" data-s="cook">高影响点</button></div><div class="control"><label>你诊断的主要问题是？</label><label class="choice"><input name="ans" type="radio" value="linear">没有明显结构性问题</label><label class="choice"><input name="ans" type="radio" value="curve">残差呈曲线模式</label><label class="choice"><input name="ans" type="radio" value="fan">残差宽度随拟合值变化</label><label class="choice"><input name="ans" type="radio" value="cook">单个点强烈改变模型</label><button class="btn" id="check">提交诊断</button></div><div class="explain" id="diagText"></div><div class="question"><b>课堂提问：</b>如果 R² 很高但残差图呈漏斗形，你更相信哪个信号？</div></aside></section><div class="footer">单文件离线交互页 · 课堂演示时建议使用 Chrome/Edge 全屏打开</div></main><script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function mean(a){return a.reduce((s,v)=>s+v,0)/a.length}function variance(a){const m=mean(a);return mean(a.map(v=>(v-m)*(v-m)))}
function ols(points){const xs=points.map(p=>p.x),ys=points.map(p=>p.y),mx=mean(xs),my=mean(ys);let num=0,den=0;for(const p of points){num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)}const b=den?num/den:0,a=my-b*mx;let sse=0,sst=0;for(const p of points){const yhat=a+b*p.x;sse+=(p.y-yhat)**2;sst+=(p.y-my)**2}return{a,b,sse,r2:sst?1-sse/sst:1,predict:x=>a+b*x}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmt(v,d=2){return Number.isFinite(v)?v.toFixed(d):'—'}
function makeRng(seed=42){let s=seed>>>0;return()=>((s=(1664525*s+1013904223)>>>0)/4294967296)}function normal(rng){let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function world(canvas,x,y){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height,p=44;return[p+x/100*(w-2*p),h-p-y/100*(h-2*p)]}function screenToWorld(canvas,sx,sy){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height,p=44;const x=sx-r.left,y=sy-r.top;return{ x:clamp((x-p)/(w-2*p)*100,0,100), y:clamp((h-p-y)/(h-2*p)*100,0,100)}}
function prep(c){const d=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return ctx}
function axes(ctx,c,title=''){const r=c.getBoundingClientRect(),w=r.width,h=r.height,p=44;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;ctx.fillStyle='#64748b';ctx.font='12px system-ui';for(let i=0;i<=5;i++){const x=p+i*(w-2*p)/5,y=p+i*(h-2*p)/5;ctx.beginPath();ctx.moveTo(x,p);ctx.lineTo(x,h-p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke();ctx.fillText(String(i*20),x-7,h-p+18);ctx.fillText(String(100-i*20),12,y+4)}ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.strokeRect(p,p,w-2*p,h-2*p);if(title){ctx.fillStyle='#0f172a';ctx.font='800 14px system-ui';ctx.fillText(title,p,p-14)}}
function drawPoints(ctx,c,pts,color='#2563eb'){for(const p of pts){const [x,y]=world(c,p.x,p.y);ctx.beginPath();ctx.fillStyle=p.color||color;ctx.arc(x,y,p.r||5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
function drawLine(ctx,c,model,color='#dc2626'){const [x1,y1]=world(c,0,model.predict(0));const [x2,y2]=world(c,100,model.predict(100));ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let i=0;i<n;i++){let max=i;for(let k=i+1;k<n;k++)if(Math.abs(M[k][i])>Math.abs(M[max][i]))max=k;[M[i],M[max]]=[M[max],M[i]];const piv=M[i][i]||1e-12;for(let j=i;j<=n;j++)M[i][j]/=piv;for(let k=0;k<n;k++)if(k!==i){const f=M[k][i];for(let j=i;j<=n;j++)M[k][j]-=f*M[i][j]}}return M.map(r=>r[n])}
function polyFit(points,deg){const n=deg+1,A=Array.from({length:n},()=>Array(n).fill(0)),b=Array(n).fill(0);for(const p of points){const xp=Array.from({length:n},(_,i)=>p.x**i);for(let i=0;i<n;i++){b[i]+=xp[i]*p.y;for(let j=0;j<n;j++)A[i][j]+=xp[i]*xp[j]}}const coef=solve(A,b);return{coef,predict:x=>coef.reduce((s,c,i)=>s+c*x**i,0)}}
function r2For(points,model){const my=mean(points.map(p=>p.y));let sse=0,sst=0;for(const p of points){sse+=(p.y-model.predict(p.x))**2;sst+=(p.y-my)**2}return sst?1-sse/sst:1}


let scene='linear',pts=[];const labels={linear:'没有明显结构性问题',curve:'残差呈曲线模式',fan:'残差宽度随拟合值变化',cook:'单个点强烈改变模型'};function gen(){const rng=makeRng({linear:1,curve:2,fan:3,cook:4}[scene]);pts=[];for(let i=0;i<38;i++){const x=8+i*2.1;let y=18+.62*x+normal(rng)*6;if(scene==='curve')y=16+.025*(x-52)**2+normal(rng)*5;if(scene==='fan')y=18+.62*x+normal(rng)*(2+x/10);pts.push({x,y})}if(scene==='cook')pts.push({x:94,y:18,color:'#dc2626',r:7})}function draw(){gen();const m=ols(pts);const c1=$('#p1'),ctx1=prep(c1);axes(ctx1,c1,'散点 + 回归线');drawLine(ctx1,c1,m);drawPoints(ctx1,c1,pts);const res=pts.map(p=>({x:m.predict(p.x),y:50+(p.y-m.predict(p.x))*3,color:p.color,r:p.r}));const c2=$('#p2'),ctx2=prep(c2);axes(ctx2,c2,'残差 vs 拟合值');ctx2.strokeStyle='#94a3b8';ctx2.beginPath();ctx2.moveTo(44,c2.getBoundingClientRect().height/2);ctx2.lineTo(c2.getBoundingClientRect().width-44,c2.getBoundingClientRect().height/2);ctx2.stroke();drawPoints(ctx2,c2,res,'#f97316');const sorted=pts.map(p=>p.y-m.predict(p.x)).sort((a,b)=>a-b);const qq=sorted.map((v,i)=>({x:10+i/(sorted.length-1)*80,y:50+v*3}));const c3=$('#p3'),ctx3=prep(c3);axes(ctx3,c3,'QQ 图（教学简图）');ctx3.strokeStyle='#94a3b8';ctx3.beginPath();let [a,b]=world(c3,10,10);ctx3.moveTo(a,b);[a,b]=world(c3,90,90);ctx3.lineTo(a,b);ctx3.stroke();drawPoints(ctx3,c3,qq,'#06b6d4');const cooks=pts.map((p,i)=>({x:8+i*(84/pts.length),y:Math.min(95,8+Math.abs(p.y-m.predict(p.x))*1.8+(p.x>85?20:0)),color:p.color||'#2563eb'}));const c4=$('#p4'),ctx4=prep(c4);axes(ctx4,c4,"Cook's distance 近似");for(const p of cooks){const [x,y]=world(c4,p.x,p.y),[,y0]=world(c4,p.x,0);ctx4.strokeStyle=p.color;ctx4.lineWidth=4;ctx4.beginPath();ctx4.moveTo(x,y0);ctx4.lineTo(x,y);ctx4.stroke()}$('#diagText').innerHTML=`<span class="pill">当前场景</span><br>${labels[scene]}。诊断图不是证明模型正确，而是提醒我们哪里不可信。`}$$('.scenario').forEach(b=>b.onclick=()=>{scene=b.dataset.s;draw()});$('#check').onclick=()=>{const v=document.querySelector('input[name=ans]:checked')?.value;$('#diagText').innerHTML=v===scene?`✅ 判断正确：${labels[scene]}。下一步应报告诊断，并考虑转换、加项、稳健标准误或敏感性分析。`:`⚠️ 再看残差图模式：本场景更接近「${labels[scene]}」。`};draw();addEventListener('resize',draw);
</script></body></html>
